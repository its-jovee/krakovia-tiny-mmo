[world-server]
port=8087
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"
database_path="."
motd="Bem vindo a Kraftovia!"
name="Classic"
max_players=50
hardcore=false
bonus_xp=0.0
max_character=5
pvp=true

[world-manager-client]
address="127.0.0.1"
port=8062
certificate_path="res://data/config/tls/certificate.crt"

[performance]
# Resource preloading
preload_resources=true
preload_items=true
preload_recipes=true
preload_handlers=true
log_performance_stats=true

[database]
# Backup settings
backup_count=3
backup_on_save=true
log_save_stats=true

[network]
# Area of Interest (AOI) System
aoi_enabled=true
aoi_grid_size=1000
aoi_view_distance=1500
aoi_update_interval=1.0

# Adaptive Sync Rates
adaptive_sync_enabled=true
sync_rate_min=5
sync_rate_max=20
sync_rate_threshold=50

# Rate Limiting
rate_limit_enabled=true
rate_limit_max_per_second=30
rate_limit_burst_max=10
rate_limit_burst_window_ms=100

# Performance Monitoring
log_network_stats=true
log_aoi_stats=false

[monitoring]
enable_logging=true
log_interval=10.0
enable_detailed=false

[instance_cleanup]
unload_check_interval=20.0
idle_time_threshold=60.0
enable_cleanup=true

[harvesting]
spatial_filtering=true
harvest_view_distance=1500.0
batch_updates=true
batch_interval=0.1
